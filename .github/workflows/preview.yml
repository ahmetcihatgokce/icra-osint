name: Önizlemeyi yayımla
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: preview-main
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build && npm test && npm run portable
      - uses: actions/upload-artifact@v4
        with:
          name: icra-preview
          path: dist/icra-osint.html
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: icra-preview
          path: /tmp/icra-preview
      - name: Önizleme dalını güncelle
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/preview; then
            git switch --track origin/preview
          else
            git switch --orphan preview
          fi
          cp /tmp/icra-preview/icra-osint.html index.html
          git add index.html
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Build from ${GITHUB_SHA}"
            git push origin HEAD:preview
          fi
