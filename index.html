<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>İcraOSINT | İcra takibi rehberi</title><meta name="description" content="Yeni avukatlar için takip açılışı, tahsil ve dosya kapanışı"><style>* {
  box-sizing: border-box;
}
body {
  margin: 0;
  font:
    16px/1.55 Arial,
    sans-serif;
}
main {
  --bg: #f4f2ec;
  --panel: #fffcf6;
  --ink: #132b40;
  --muted: #526575;
  --line: #cec9b9;
  --gold: #886b30;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
}
main[data-theme="dark"] {
  --bg: #0d2030;
  --panel: #142c3d;
  --ink: #f1eee6;
  --muted: #cad1d4;
  --line: #435766;
  --gold: #e0bd77;
  color-scheme: dark;
}
header,
aside {
  background: #102a3d;
  color: #f7f3e8;
  display: flex;
  align-items: center;
  padding: 18px max(5vw, 20px);
  gap: 36px;
}
header {
  border-bottom: 3px solid #b59454;
}
.brand {
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -1px;
  white-space: nowrap;
}
.brand span,
h1 span {
  color: #bea469;
}
.brand b {
  display: inline-grid;
  place-items: center;
  font: italic 30px Georgia;
  color: #e3c686;
  border: 1px solid #bea469;
  width: 36px;
  height: 40px;
  margin-right: 6px;
}
nav,
.filters,
.bar,
.tags {
  display: flex;
  gap: 10px;
  align-items: center;
}
button,
input,
textarea,
select {
  font: inherit;
  color: inherit;
}
button,
select {
  cursor: pointer;
}
button,
select,
input,
textarea {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: 8px 12px;
}
button:hover,
a:hover {
  text-decoration: underline;
}
nav button,
.theme {
  color: #f5f1e8;
  background: none;
  border-color: transparent;
}
nav button[aria-current="page"] {
  border-bottom: 2px solid #c4a15f;
  border-radius: 0;
}
.theme {
  margin-left: auto;
  font-size: 22px;
}
.wrap {
  max-width: 1240px;
  margin: auto;
  padding: 32px 5% 48px;
}
.hero {
  position: relative;
  overflow: hidden;
  background: #17364b;
  color: #fff9e8;
  border-radius: 10px;
  padding: 34px 38px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background-image: repeating-linear-gradient(
    130deg,
    transparent 0 41px,
    #ffffff07 41px 42px
  );
}
small {
  color: var(--gold);
  letter-spacing: 0.14em;
  font-size: 11px;
  font-weight: bold;
}
.hero small {
  color: #e3c58b;
}
h1,
h2,
h3 {
  line-height: 1.15;
}
h1,
h2 {
  font-family: Georgia, serif;
  font-weight: normal;
  margin: 12px 0;
}
h1 {
  font-size: clamp(40px, 5vw, 68px);
}
h2 {
  font-size: 34px;
}
.hero p {
  color: #dce3e3;
  margin: 6px 0;
}
.seal {
  border: 1px solid #ab9364;
  border-radius: 50%;
  outline: 1px solid #ab936460;
  outline-offset: 8px;
  width: 95px;
  height: 95px;
  text-align: center;
  font: 68px/95px Georgia;
  color: #d7bd84;
}
.bar {
  margin: 24px 0 12px;
}
.search {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 5px;
  padding-left: 12px;
}
.search input {
  border: 0;
  min-width: 0;
  width: 100%;
}
.filters {
  flex-wrap: wrap;
  margin-bottom: 20px;
}
.filters span {
  margin-left: auto;
  color: var(--muted);
}
.filters button[aria-pressed="true"],
.primary {
  background: #17364b;
  color: white;
  border: 1px solid #17364b;
}
.columns {
  display: grid;
  grid-template-columns: minmax(250px, 0.85fr) 1.65fr;
  gap: 20px;
  align-items: start;
}
.tree,
.card,
.guide section,
.desk section,
form {
  background: var(--panel);
  border: 1px solid var(--line);
  padding: 24px;
  border-radius: 8px;
}
.tree summary {
  cursor: pointer;
  font-weight: bold;
  padding: 6px 0;
}
.tree > small {
  display: block;
  margin-bottom: 12px;
}
.branch {
  margin-left: 12px;
  border-left: 1px solid var(--line);
  padding-left: 12px;
}
.branch summary {
  font-size: 14px;
}
.branch button {
  display: block;
  width: 100%;
  text-align: left;
  border: none;
  background: none;
  font-size: 14px;
  padding: 6px;
}
.branch .sel {
  background: #b49b5528;
  color: var(--gold);
  font-weight: bold;
}
.card {
  border-top: 3px solid #ab8a48;
  padding: 30px;
}
.tags {
  flex-wrap: wrap;
}
.tags em {
  font: 12px Arial;
  padding: 5px 9px;
  border-radius: 20px;
  border: 1px solid var(--line);
  color: var(--gold);
}
p {
  color: var(--muted);
}
h3 {
  font-size: 18px;
  margin: 22px 0 7px;
}
.primary {
  display: inline-block;
  text-decoration: none;
  padding: 10px 18px;
  border-radius: 4px;
}
.card footer {
  margin-top: 16px;
  color: var(--muted);
  font-size: 13px;
}
a {
  color: inherit;
}
.guide,
.desk {
  max-width: 900px;
  margin: auto;
}
.guide section,
.desk section,
form {
  margin: 14px 0;
}
.desk label {
  display: grid;
  gap: 4px;
  margin: 10px 0;
}
.formgrid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0 14px;
}
.desk input,
.desk select,
.desk textarea {
  width: 100%;
  min-width: 0;
}
.desk textarea {
  min-height: 70px;
}
.hash,
blockquote,
.print {
  overflow-wrap: anywhere;
}
blockquote {
  max-height: 220px;
  overflow: auto;
  margin: 14px 0;
  padding: 16px;
  border-left: 3px solid var(--gold);
}
.map {
  width: 100%;
  max-height: 500px;
}
.map g[role="button"] {
  cursor: pointer;
}
aside {
  font-size: 13px;
  gap: 6px;
}
.print,
[hidden] {
  display: none !important;
}
@media (max-width: 700px) {
  header {
    flex-wrap: wrap;
    gap: 2px;
    padding: 12px 16px;
  }
  nav {
    order: 3;
    width: 100%;
    justify-content: space-between;
    gap: 0;
  }
  nav button {
    font-size: 14px;
  }
  .wrap {
    padding: 16px;
  }
  .hero,
  .card,
  .tree {
    padding: 20px;
  }
  .seal {
    display: none;
  }
  .columns,
  .formgrid {
    grid-template-columns: 1fr;
  }
  .tree {
    max-height: 270px;
    overflow: auto;
  }
  .bar {
    flex-wrap: wrap;
  }
  .bar select {
    max-width: 43%;
  }
  .filters {
    gap: 5px;
  }
  .filters button {
    padding: 6px 8px;
  }
}
@media print {
  header,
  aside,
  .desk,
  .guide,
  .hero {
    display: none !important;
  }
  .print {
    display: block !important;
  }
  .wrap,
  main {
    background: white;
    color: black;
    padding: 0;
  }
  .print section {
    break-inside: avoid;
    border-bottom: 1px solid gray;
  }
  .print p {
    color: black;
    margin: 4px;
  }
}
.journey .columns{margin-top:20px}.stages{display:flex;align-items:stretch;flex-direction:column;gap:4px}.stages button{color:var(--ink);text-align:left;background:none;border:0}.stages button[aria-current=step]{background:#b49b5530;font-weight:bold}.journey li{margin-bottom:12px}.journey ol,.journey ul{padding-left:22px}.journey .card{overflow-wrap:anywhere}@media(max-width:700px){.stages{max-height:none;display:grid;grid-template-columns:1fr 1fr}.stages button{padding:6px;font-size:13px}}
